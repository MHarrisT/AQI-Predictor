name: Training Pipeline

on:
  push:
    branches: [ "main" ] # Triggers automatically on push to main branch
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight (00:00 UTC)
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub UI

jobs:
  train-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff # Install the ruff formatter
          
      - name: Auto-format with Ruff
        run: ruff format .
        
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with ruff"
          

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python training_pipeline/train.py
